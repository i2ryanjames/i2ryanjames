<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }
    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
    }
    .site-name {
      font-size: 1.25rem;
      font-weight: 600;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px;
    }
    h1 {
      margin-bottom: 16px;
    }
    p {
      line-height: 1.6;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <img src="flower-logo.svg" alt="Flower logo" class="logo">
    <span class="site-name">My Site</span>
  </header>
  <main>
    <h1>Welcome</h1>
    <p>This site now features a flower logo.</p>
  </main>
</body>
</html>
