<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Flower petals -->
  <ellipse cx="50" cy="30" rx="14" ry="20" fill="#FF6B8A" transform="rotate(0, 50, 50)"/>
  <ellipse cx="50" cy="30" rx="14" ry="20" fill="#FF8FA8" transform="rotate(72, 50, 50)"/>
  <ellipse cx="50" cy="30" rx="14" ry="20" fill="#FF6B8A" transform="rotate(144, 50, 50)"/>
  <ellipse cx="50" cy="30" rx="14" ry="20" fill="#FF8FA8" transform="rotate(216, 50, 50)"/>
  <ellipse cx="50" cy="30" rx="14" ry="20" fill="#FF6B8A" transform="rotate(288, 50, 50)"/>
  <!-- Flower center -->
  <circle cx="50" cy="50" r="10" fill="#FFD700"/>
  <!-- Stem -->
  <line x1="50" y1="60" x2="50" y2="90" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="40" cy="78" rx="10" ry="5" fill="#4CAF50" transform="rotate(-30, 40, 78)"/>
  <ellipse cx="60" cy="72" rx="10" ry="5" fill="#4CAF50" transform="rotate(30, 60, 72)"/>
</svg>
